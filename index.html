<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='none' stroke='%23ff3131' stroke-width='4' opacity='0.3'/%3E%3Ccircle cx='50' cy='50' r='30' fill='none' stroke='%23ff3131' stroke-width='4' opacity='0.5'/%3E%3Ccircle cx='50' cy='50' r='15' fill='none' stroke='%23ff3131' stroke-width='4' opacity='0.8'/%3E%3Ccircle cx='50' cy='50' r='5' fill='%23ff3131'/%3E%3Cline x1='50' y1='50' x2='50' y2='10' stroke='%23ff3131' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E" />
    <title>Market Radar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              radar: {
                50: '#fef2f2',
                100: '#fee2e2',
                400: '#f87171',
                500: '#ef4444',
                600: '#dc2626',
                900: '#7f1d1d',
                accent: '#ff3131', // ROUGE NÉON
                blue: '#3b82f6',
                purple: '#8b5cf6',
                dark: '#030712',
                card: '#0a0a0a',
              }
            },
            animation: {
              'blob': 'blob 10s infinite',
              'tilt': 'tilt 10s infinite linear',
              'scan': 'scan 4s linear infinite',
            },
            keyframes: {
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' },
              },
              tilt: {
                '0%, 50%, 100%': { transform: 'rotate(0deg)' },
                '25%': { transform: 'rotate(0.5deg)' },
                '75%': { transform: 'rotate(-0.5deg)' },
              },
              scan: {
                '0%': { transform: 'translateY(-100%)' },
                '100%': { transform: 'translateY(100vh)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        /* Removed background-color to let the React component handle it */
        color: #ffffff;
        overflow-x: hidden;
        margin: 0;
      }
      
      /* Force hardware acceleration */
      .gpu-accelerated {
        transform: translateZ(0);
        will-change: transform;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #030712; 
      }
      ::-webkit-scrollbar-thumb {
        background: #1f2937; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #ff3131; 
      }

      /* Glassmorphism Utilities */
      .glass-card {
        background: rgba(10, 10, 10, 0.6);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      
      .text-glow {
        text-shadow: 0 0 20px rgba(255, 49, 49, 0.5);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.12.0",
    "framer-motion": "https://esm.sh/framer-motion@^12.26.2"
  }
}
</script>

</head>

</html>
